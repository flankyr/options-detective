[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["build", "dist", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]  # black owns line length

[tool.black]
line-length = 100
target-version = ["py311"]
extend-exclude = "build|dist|\\.venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
