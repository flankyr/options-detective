name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  math:
    name: Python math engine (pytest)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: backend/math
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/math/requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q
      - name: ruff (advisory until the format-once commit lands)
        run: python -m ruff check .
        continue-on-error: true

  backend:
    name: Express backend (node --test, real engine)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # the backend resolves backend/math/.venv/Scripts/python.exe, same as a dev machine
      - name: Create math venv
        working-directory: backend/math
        run: |
          python -m venv .venv
          .venv\Scripts\python.exe -m pip install -r requirements.txt
      - run: npm ci
        working-directory: backend
      - run: npm test
        working-directory: backend
        env:
          OD_REQUIRE_ENGINE: "1"   # a skipped engine suite in CI is a misconfiguration, not a pass
          OD_DATA_DIR: ${{ runner.temp }}\od-data

  frontend:
    name: Frontend (tsc + vite build)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit -p .
      - run: npx vite build
      - name: eslint (advisory until the format-once commit lands)
        run: npm run lint
        continue-on-error: true
